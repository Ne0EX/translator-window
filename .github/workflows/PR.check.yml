name: Local release check

on:
  workflow_dispatch:
  push:
    branches: [ "local-translator" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build:
    runs-on: windows-latest  # For a list of available runner types, refer to
                             # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    # Install the .NET Core workload
    - name: Install .NET Core
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x

    - name: Build the application
      run: dotnet build src/Translumo/Translumo.csproj --configuration Release --nologo

    - name: Check subtitle geometry
      run: dotnet run --project tests/overlay/OverlayCheck.csproj --configuration Release

    - name: Check vertical subtitle geometry
      run: dotnet run --project tests/overlay/OverlayCheck.csproj --configuration Release --no-restore -- --vertical

    - name: Check live layout and cancellation
      run: dotnet run --project tests/layout-hold/LayoutHoldCheck.csproj --configuration Release
